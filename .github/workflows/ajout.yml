name: Ajout (issue « ajout », « prix » ou « achat »)

# Déclenché quand l'étiquette « ajout » ou « prix » est posée sur une issue (le lien du site la pose
# à la création). Sans IA : avec des liens marchands, l'article est créé et relevé tout de suite ;
# en texte libre, il passe « à-identifier » et l'identification par Claude est tentée (claude.yml).

on:
  issues:
    types: [labeled]

# une file par issue : une demande n'est jamais annulée par le relevé quotidien ou une autre demande
# (les fichiers append-only fusionnent ligne à ligne, voir .gitattributes)
concurrency:
  group: ajout-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  traiter:
    # seulement les demandes écrites par le propriétaire du dépôt ou ses collaborateurs
    if: >-
      contains(fromJSON('["ajout","prix","achat"]'), github.event.label.name) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
    outputs:
      mode: ${{ steps.lire.outputs.mode }}
      id: ${{ steps.lire.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      NUMERO: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install truststore

      - name: Lire la demande
        id: lire
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: python -m prixjuste issue --numero "$NUMERO"

      - name: Premier relevé + archives
        id: releve
        if: steps.lire.outputs.mode == 'liens'
        env:
          ARTICLE: ${{ steps.lire.outputs.id }}
        run: python -m prixjuste premier-releve "$ARTICLE"

      - name: Publier les données
        if: contains(fromJSON('["liens","a_identifier","prix","achat"]'), steps.lire.outputs.mode)
        env:
          ARTICLE: ${{ steps.lire.outputs.id }}
        run: |
          .github/scripts/publier-donnees.sh "Ajout n°$NUMERO : $ARTICLE"

      - name: Répondre sur l'issue
        env:
          MODE: ${{ steps.lire.outputs.mode }}
          ARTICLE: ${{ steps.lire.outputs.id }}
          MESSAGE_LIRE: ${{ steps.lire.outputs.message }}
          MESSAGE_RELEVE: ${{ steps.releve.outputs.message }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          case "$MODE" in
            liens)
              { echo "Article créé : \`$ARTICLE\` — premier relevé fait."; echo; echo "$MESSAGE_RELEVE"; echo;
                echo "Fiche : $PAGES/a/$ARTICLE.html (mise en ligne dans une minute)"; } > reponse.md
              gh issue comment "$NUMERO" --body-file reponse.md
              gh issue close "$NUMERO" --reason completed ;;
            prix|achat)
              { echo "$MESSAGE_LIRE"; echo; echo "Fiche : $PAGES/a/$ARTICLE.html"; } > reponse.md
              gh issue comment "$NUMERO" --body-file reponse.md
              gh issue close "$NUMERO" --reason completed ;;
            a_identifier)
              gh issue edit "$NUMERO" --add-label "à-identifier"
              { echo "Pas de lien marchand dans la demande : l'objet \`$ARTICLE\` est **en attente d'identification**."; echo;
                echo "- Si Claude est activé sur ce dépôt (voir LISEZMOI), il cherche la référence exacte et des pages marchands lisibles, puis le suivi démarre."; 
                echo "- Sinon, ou pour aller plus vite : modifie le texte de cette demande pour y coller un lien produit, puis retire et remets l'étiquette « ajout »."; } > reponse.md
              gh issue comment "$NUMERO" --body-file reponse.md ;;
            erreur)
              printf '%s\n' "Demande non traitée : $MESSAGE_LIRE" > reponse.md
              gh issue comment "$NUMERO" --body-file reponse.md ;;
            deja)
              echo "Issue déjà traitée ($ARTICLE)." ;;
          esac

      - name: Construire le site
        if: contains(fromJSON('["liens","a_identifier","prix","achat"]'), steps.lire.outputs.mode)
        run: python -m prixjuste site --sortie site

      - uses: actions/upload-pages-artifact@v3
        if: contains(fromJSON('["liens","a_identifier","prix","achat"]'), steps.lire.outputs.mode)
        with:
          path: site

  deployer:
    needs: traiter
    if: contains(fromJSON('["liens","a_identifier","prix","achat"]'), needs.traiter.outputs.mode)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  identifier:
    needs: [traiter, deployer]
    if: needs.traiter.outputs.mode == 'a_identifier'
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    uses: ./.github/workflows/claude.yml
    with:
      issue: ${{ github.event.issue.number }}
    secrets: inherit
